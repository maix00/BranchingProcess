          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          # Compile independent test modules across ubuntu-latest's four CPUs.
          python3 scripts/run-all-lean-tests.py --jobs 4 --output-dir "$RUNNER_TEMP/lean-tests"
          : > "$RUNNER_TEMP/positive-definite-axioms.txt"
