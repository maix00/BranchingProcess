name: Lean build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Lake build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Identify the pinned Mathlib revision
        id: mathlib-revision
        run: echo "sha=$(git -C Vendor/Mathlib rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The Mathlib cache service has no matching artifact set for this pinned source
      # tree. lean-action caches the root .lake directory, while this path belongs to
      # the Mathlib submodule and needs its own stable cache.
      - name: Restore the Mathlib build cache
        id: mathlib-build-cache
        uses: actions/cache/restore@v5
        with:
          path: Vendor/Mathlib/.lake/build
          key: mathlib-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'Vendor/Mathlib/lean-toolchain') }}-${{ steps.mathlib-revision.outputs.sha }}
          restore-keys: |
            mathlib-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'Vendor/Mathlib/lean-toolchain') }}-

      # A pull_request run cannot restore a cache saved by a push to its head
      # branch. Transfer the build through a short-lived artifact from preflight.
      - name: Find the preflight Mathlib build artifact
        id: mathlib-build-artifact
        if: >-
          steps.mathlib-build-cache.outputs.cache-hit != 'true' &&
          ((github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: actions/github-script@v9
        with:
          script: |
            const artifactName = `mathlib-build-${{ hashFiles('lean-toolchain', 'Vendor/Mathlib/lean-toolchain') }}-${{ steps.mathlib-revision.outputs.sha }}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFullName = `${owner}/${repo}`;
            const pause = ms => new Promise(resolve => setTimeout(resolve, ms));

            for (let attempt = 0; attempt < 40; attempt++) {
              const artifacts = await github.paginate(
                github.rest.actions.listArtifactsForRepo,
                { owner, repo, per_page: 100 }
              );
              const candidates = artifacts
                .filter(a => a.name === artifactName && !a.expired && a.workflow_run?.id)
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));

              for (const artifact of candidates) {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner, repo, run_id: artifact.workflow_run.id
                });
                if (run.event === 'push' && run.head_branch === 'preflight' &&
                    run.head_repository?.full_name === repoFullName &&
                    run.path === '.github/workflows/build.yml') {
                  core.setOutput('run-id', String(run.id));
                  core.setOutput('artifact-name', artifactName);
                  core.info(`Using Mathlib build artifact from push run ${run.id}.`);
                  return;
                }
              }

              if (attempt % 5 === 0)
                core.info(`Waiting for the matching preflight artifact (${attempt + 1}/40).`);
              await pause(30_000);
            }

            core.notice('No preflight Mathlib artifact was found; continuing with the normal build path.');

      - name: Download the preflight Mathlib build artifact
        if: steps.mathlib-build-artifact.outputs.run-id != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.mathlib-build-artifact.outputs.artifact-name }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.mathlib-build-artifact.outputs.run-id }}
          path: ${{ runner.temp }}/mathlib-build-artifact

      - name: Restore the Mathlib build files
        if: steps.mathlib-build-artifact.outputs.run-id != ''
        run: |
          mkdir -p Vendor/Mathlib/.lake
          tar --zstd -xf "$RUNNER_TEMP/mathlib-build-artifact/mathlib-build.tar.zst" \
            -C Vendor/Mathlib/.lake

      - name: Install Lean and build the package
        uses: leanprover/lean-action@v1
        with:
          # Mathlib has not published a cache for this fork; use the pinned
          # GitHub build cache or the matching short-lived artifact instead.
          use-mathlib-cache: false

      - name: Save the Mathlib build cache
        if: success() && steps.mathlib-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: Vendor/Mathlib/.lake/build
          key: mathlib-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'Vendor/Mathlib/lean-toolchain') }}-${{ steps.mathlib-revision.outputs.sha }}

      - name: Package Mathlib build files for PR runs
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/preflight'
        run: |
          set -o pipefail
          tar -cf - -C Vendor/Mathlib/.lake build \
            | zstd -T0 -3 -o "$RUNNER_TEMP/mathlib-build.tar.zst"

      - name: Upload the short-lived Mathlib build artifact
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/preflight'
        uses: actions/upload-artifact@v7
        with:
          name: mathlib-build-${{ hashFiles('lean-toolchain', 'Vendor/Mathlib/lean-toolchain') }}-${{ steps.mathlib-revision.outputs.sha }}
          path: ${{ runner.temp }}/mathlib-build.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Check stable APIs, proof dependencies, and import boundaries
        run: |
          set -o pipefail
          node scripts/check-visualizer-manifest.mjs
          lake build \
            Analysis.Asymptotics.RegularVariation.Basic \
            Analysis.Asymptotics.RegularVariation.Integral.Basic \
            Analysis.Asymptotics.RegularVariation.Integral.Tail \
            MeasureTheory.Measure.CadlagPath.RangeCover \
            Probability.Process.Stable.Corridor.Law \
            Probability.Process.Stable.SmallDeviation.ShiftedCorridor \
            Probability.Process.Stable.SmallDeviation.RangeComparison \
            Probability.Process.Stable.SmallDeviation.BlockBounds \
            Probability.Process.Stable.SmallDeviation.Blocks.Upper.ArbitraryHorizon \
            Probability.Process.Stable.SmallDeviation.EndpointComparison \
            Probability.Process.Stable.SmallDeviation.EscapeRate.Basic \
            Probability.Process.Stable.SmallDeviation.EscapeRate.Corridor \
            Probability.Process.Stable.SmallDeviation.EscapeRate.Endpoint \
            Probability.Process.Stable.SmallDeviation.EscapeRate.Law \
            Probability.Distributions.Moments.Truncated.Basic \
            Probability.Distributions.Moments.Truncated.TailIntegral \
            Analysis.Asymptotics.RegularVariation.AtZero.Potter \
            Analysis.Fourier.PositiveDefinite \
            MeasureTheory.Measure.CharacteristicFunction.PositiveDefinite \
            Analysis.Fourier.Bochner.Theorem \
            Analysis.Fourier.CosineTauberian.Kernel \
            Analysis.Fourier.CosineTauberian.Inversion \
            Analysis.Fourier.CosineTauberian.Mellin \
            Analysis.Fourier.CosineTauberian.RegularVariation \
            Probability.Distributions.CharacteristicFunction.CosineDefect \
            Probability.Distributions.CharacteristicFunction.Symmetrization.Basic \
            Probability.Distributions.CharacteristicFunction.Tauberian.SecondTail \
            Probability.Distributions.Stable.Attraction.NormingRatios.Tauberian \
            Probability.Distributions.CharacteristicFunction.GaussianSmoothing \
            MeasureTheory.Measure.CharacteristicFunction.Nondegenerate \
            Probability.Distributions.DomainOfAttraction.Basic \
            Probability.Distributions.DomainOfAttraction.CharacteristicFunction \
            Probability.Distributions.DomainOfAttraction.Block \
            MeasureTheory.Measure.CharacteristicFunction.Convergence \
            Probability.Distributions.Stable.Attraction.Norming.Basic \
            Probability.Distributions.Stable.Attraction.CharacteristicFunction \
            Probability.Distributions.Stable.Attraction.NormingRatios.Index \
            Probability.Distributions.Stable.Attraction.NormingRatios.UniformDefect \
            Probability.Distributions.Stable.Attraction.NormingRatios.RegularVariation \
            Probability.Distributions.Stable.Attraction.Normal.QuadraticTail \
            Probability.Process.RandomWalk.SmallDeviation.Mogulskii.Stable.Discrete.Endpoint.Upper \
            Probability.Process.RandomWalk.SmallDeviation.Mogulskii.Stable.Discrete.Endpoint.Lemmas.Return \
            MeasureTheory.Measure.CadlagPath.PathClass.StepCorridor.Energy \
            Probability.Process.Path.PathClass.StepCorridor.Probability.Rate.FiniteUnion \
            Probability.Process.Path.PathClass.StepCorridor.Probability.Rate.Approximation \
