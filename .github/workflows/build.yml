name: Lean build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lake build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Lean and build the package
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Check stable small-deviation APIs and proof dependencies
        run: |
          set -o pipefail
          lake build \
            Probability.Process.Stable.SmallDeviation.ShiftedCorridor \
            Probability.Process.Stable.SmallDeviation.RangeComparison
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          : > "$RUNNER_TEMP/stable-small-deviation-axioms.txt"
          lake env lean BranchingProcessTest/Stable/ShiftedCorridor.lean \
            2>&1 | tee -a "$RUNNER_TEMP/stable-small-deviation-axioms.txt"
          lake env lean BranchingProcessTest/Stable/RangeComparison.lean \
            2>&1 | tee -a "$RUNNER_TEMP/stable-small-deviation-axioms.txt"
          python3 scripts/check-lean-axioms.py \
            "$RUNNER_TEMP/stable-small-deviation-axioms.txt" --expected-count 6
          python3 scripts/check-stable-small-deviation-imports.py
