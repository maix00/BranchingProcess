name: Lean build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lake build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Lean and build the package
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
