name = "ThesisSpeed"
version = "0.1.0"
defaultTargets = ["ThesisSpeed"]

[[require]]
name = "BrownianMotion"
git = "https://github.com/RemyDegenne/brownian-motion.git"
rev = "master"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "d11a0f468e80dbefaf47a5d477f273085560665a"

[[lean_lib]]
name = "ThesisSpeed"
# The library is every module of the three top-level directories. A glob keeps
# the whole tree in the build; listing roots by hand silently dropped the
# modules no listed root imported (the cloud order layer, for instance).
globs = ["Combinatorics.+", "MeasureTheory.+", "Probability.+"]
