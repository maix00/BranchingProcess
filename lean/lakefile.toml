name = "ThesisSpeed"
version = "0.1.0"
defaultTargets = ["ThesisSpeed"]

[[require]]
name = "BrownianMotion"
git = "https://github.com/RemyDegenne/brownian-motion.git"
# Keep the external foundation reproducible alongside the pinned mathlib.
rev = "0d5b6eb928e616d3b1f774ad7d233c167d9f42c9"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "ae6f1eeba63041889d82d9ed777b263435ca3424"

[[lean_lib]]
name = "ThesisSpeed"
# The library is every module of the four top-level directories. A glob keeps
# the whole tree in the build; listing roots by hand silently dropped the
# modules no listed root imported (the cloud order layer, for instance).
globs = ["Analysis.+", "Combinatorics.+", "LinearAlgebra.+", "MeasureTheory.+", "Probability.+", "Topology.+"]
