name = "BranchingProcess"
version = "0.1.0"
defaultTargets = ["BranchingProcess"]

[[require]]
name = "BrownianMotion"
path = "Vendor/BrownianMotion"
# This tracked snapshot of the fork is described in Vendor/BrownianMotion/UPSTREAM.md.

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "380f2aafb622cb2c1c93dac545b6389083c68c51"

[[lean_lib]]
name = "BranchingProcess"
# Keep every project source root in the build, including modules with no
# importers. Omitting a root would let its files silently skip the build.
globs = ["Algebra.+", "Analysis.+", "Combinatorics.+", "LinearAlgebra.+", "MeasureTheory.+", "Order.+", "Probability.+", "Topology.+"]
