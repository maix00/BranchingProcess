name = "BranchingProcess"
version = "0.1.0"
defaultTargets = ["BranchingProcess"]

[[require]]
name = "BrownianMotion"
git = "https://github.com/RemyDegenne/brownian-motion.git"
# Keep the external foundation reproducible alongside the pinned mathlib.
rev = "0d5b6eb928e616d3b1f774ad7d233c167d9f42c9"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "380f2aafb622cb2c1c93dac545b6389083c68c51"

[[lean_lib]]
name = "BranchingProcess"
# Keep every project source root in the build, including modules with no
# importers. Omitting a root would let its files silently skip the build.
globs = ["Algebra.+", "Analysis.+", "Combinatorics.+", "LeanLevy.+", "LinearAlgebra.+", "MeasureTheory.+", "Order.+", "Probability.+", "Topology.+"]
